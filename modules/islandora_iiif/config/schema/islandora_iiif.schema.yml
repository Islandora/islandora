islandora_iiif.settings:
  type: config_object
  label: 'Islandora IIIF Settings'
  mapping:
    iiif_server:
      type: string
      label: 'IIIF Server Url'
    use_relative_paths:
    type: boolean
    label: 'Use relative paths in manifest.'

views.style.iiif_manifest:
  type: views_style
  mapping:
    iiif_tile_field:
      type: sequence
      sequence:
        type: string
      label: "Tile source field(s)"
    iiif_ocr_file_field:
      type: sequence
      sequence:
        type: string:
      label: "IIIF hOCR file field"
    structured_text_term:
      type: string
      label: "Structured text term"
    getdimensions_from_sewrver:
      type: boolean
      label: "Retrieve image dimensions from IIIF server"
    search_endpoint:
      type: string
      label: "Search endpoint path"
